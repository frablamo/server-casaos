[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-butler"
version = "0.1.0"
description = "Telegram bot that sorts downloaded media into Kids/Movies/Series and can reboot the server"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0,<23",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
media-butler = "media_butler.__main__:main"

[tool.setuptools]
packages = ["media_butler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
